const AUDIO_WORD_BASE='https://raw.githubusercontent.com/hugolpz/audio-cmn/master/64k/hsk/cmn-';
const AUDIO_SOURCE='https://github.com/hugolpz/audio-cmn';
const REPORT_KEY='hanzi_radicals_audio_reports_v1';
const AUDIO_PREF_KEY='hanzi_radicals_audio_preferences_v1';
let audioPreferences={};try{audioPreferences=JSON.parse(localStorage.getItem(AUDIO_PREF_KEY))||{}}catch(e){}
const MISSING_CHARACTER_RECORDINGS=new Set(['朱','召','巴','及']);
const ALTERNATIVE_HSK_VOICE={'朱':'猪','召':'照'};
const COMMONS_AUDIO={
 '申':{file:'Zh-shēn.ogg',kind:'syllable'},
 '朱':{file:'Zh-zhū.ogg',kind:'syllable'},
 '巴':{file:'Zh-bā.ogg',kind:'syllable'}
};
function commonsAudioUrl(x){return COMMONS_AUDIO[x]?'https://commons.wikimedia.org/wiki/Special:Redirect/file/'+encodeURIComponent(COMMONS_AUDIO[x].file):null}

const audioFailedThisSession=new Set();
function showAudioStatus(x,message){
 document.querySelectorAll('[data-audio-status]').forEach(el=>{if(el.dataset.audioStatus===x)el.textContent=message});
}
function choosePreferredAudio(x,variant){
 audioPreferences[x]=variant;
 try{localStorage.setItem(AUDIO_PREF_KEY,JSON.stringify(audioPreferences))}catch(e){}
 document.querySelectorAll('[data-audio-preference]').forEach(b=>{if(b.dataset.audioPreference===x){const selected=b.dataset.prefVariant===variant;b.classList.toggle('good',selected);b.classList.toggle('alt',!selected);b.setAttribute('aria-pressed',String(selected))}});
 showAudioStatus(x,'✓ Предпочтение сохранено: '+(variant==='syllable'?'слог':'знак')+'.');
}

let audioReports={};try{audioReports=JSON.parse(localStorage.getItem(REPORT_KEY))||{}}catch(e){}
let audioSelection=null;
function remoteAudioUrl(key){return AUDIO_BASE+encodeURIComponent(key)+'.mp3'}
function remoteCharacterUrl(char){return AUDIO_WORD_BASE+encodeURIComponent(char)+'.mp3'}
function stopAudio(){if(currentRecording){currentRecording.pause();currentRecording.onended=null;currentRecording.onerror=null;currentRecording=null}}
function playRecording(url,x,py,local=false,variant='syllable'){
 const a=new Audio();currentRecording=a;a.preload='auto';a.src=url;
 let retried=false,characterFallback=false,finished=false,activeVariant=variant;
 const cleanup=()=>{if(finished)return;finished=true;if(local)URL.revokeObjectURL(url);if(currentRecording===a)currentRecording=null};
 const fail=()=>{if(finished)return;cleanup();audioFailedThisSession.add(x+'|'+variant);
  showAudioStatus(x,'⚠ Запись «'+(variant==='character'?'Знак':'Слог')+'» не воспроизводится. Попробуй '+(variant==='character'?'«Слог»':'другую запись')+'.');};
 const fallback=()=>{
  if(finished)return;
  if(variant==='commons'&&!retried){retried=true;activeVariant='syllable';
    showAudioStatus(x,'Wikimedia Commons недоступен на этом устройстве. Включаю слог из основной библиотеки.');
    a.src=remoteAudioUrl(toneFile(py));a.load();a.play().catch(fail);return;
  }
  if(!retried&&!local&&url.startsWith('https://raw.githubusercontent.com/hugolpz/audio-cmn/master/')){
   retried=true;a.src=url.replace('https://raw.githubusercontent.com/hugolpz/audio-cmn/master/','https://cdn.jsdelivr.net/gh/hugolpz/audio-cmn@master/');
   a.load();a.play().catch(fail);
  }else if(variant==='character'&&!characterFallback&&toneFile(py)&&!toneFile(py).endsWith('5')){
    characterFallback=true;activeVariant='syllable';
    showAudioStatus(x,'Нет доступной записи знака. Включаю слог '+py+' с тем же тоном.');
    a.src=remoteAudioUrl(toneFile(py));a.load();a.play().catch(fail);
  }else fail();
 };
 a.onended=cleanup;
 a.onplaying=()=>{audioFailedThisSession.delete(x+'|'+variant);showAudioStatus(x,'▶ Воспроизводится '+(activeVariant==='character'?'знак':'слог')+'.')};
 a.onerror=fallback;
 a.play().catch(e=>{if(e&&e.name==='NotAllowedError'){cleanup();showAudioStatus(x,'Safari заблокировал запуск. Нажми кнопку ещё раз.')}else fallback()});
}
function speak(x,variant='syllable'){
 stopAudio();
 const py=getReading(x);
 if(!py){showAudioStatus(x,'Для этого знака пока не задано однозначное чтение.');return}
 const key=toneFile(py);
 if(!key){showAudioStatus(x,'Для «'+x+'» нужно выбрать одно конкретное чтение.');return}
 if(variant==='alternate'&&ALTERNATIVE_HSK_VOICE[x]){
  audioSelection={char:x,pinyin:py,variant};showAudioStatus(x,'Альтернативная запись слога '+py+' из иероглифа '+ALTERNATIVE_HSK_VOICE[x]+'.');playRecording(remoteCharacterUrl(ALTERNATIVE_HSK_VOICE[x]),x,py,false,'alternate');return;
 }
 if(variant==='commons'||(variant==='character'&&x==='申')){
  const url=commonsAudioUrl(x);
  if(url){audioSelection={char:x,pinyin:py,variant:'commons'};
   showAudioStatus(x,COMMONS_AUDIO[x].kind==='character'?'Запись иероглифа Wikimedia Commons.':'Дополнительный голос: произносится слог, а не сам знак.');
   playRecording(url,x,py,false,'commons');return}
 }
 if(variant==='character'&&MISSING_CHARACTER_RECORDINGS.has(x)){
  showAudioStatus(x,'Для «'+x+'» нет отдельного файла знака. Проигрываю записанный слог '+py+'.');
  audioSelection={char:x,pinyin:py,variant:'syllable'};
  playRecording(remoteAudioUrl(key),x,py,false,'syllable');return;
 }
 if(variant==='syllable'&&key.endsWith('5')){showAudioStatus(x,'Для нейтрального тона нет проверенного слогового файла.');return}
 audioSelection={char:x,pinyin:py,variant};
 showAudioStatus(x,'Загрузка записи…');
 playRecording(variant==='character'?remoteCharacterUrl(x):remoteAudioUrl(key),x,py,false,variant);
}
function reportAudio(x,variant){
 const py=getReading(x)||'—', k=x+'|'+variant;
 const labels={syllable:'Слог',character:'Иероглиф',commons:'Wikimedia Commons',alternate:'Альтернативный голос'};
 audioReports[k]={char:x,pinyin:py,source:labels[variant]||variant,issue:audioFailedThisSession.has(k)?'не воспроизводится':'обрезается / неразборчиво',updated:new Date().toISOString()};
 try{localStorage.setItem(REPORT_KEY,JSON.stringify(audioReports))}catch(e){}
 const el=document.querySelector('[data-report-status="'+x+'"]');
 if(el)el.textContent='⚑ Отмечено. Список можно выгрузить во вкладке «Прогресс».';
 else alert('Замечание сохранено. Список можно выгрузить во вкладке «Прогресс».');
}
function downloadAudioReports(){
 const data={version:'0.5.5',reports:Object.values(audioReports),preferences:audioPreferences};
 const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='hanzi-audio-reports.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
async function addAudioFiles(fileList){let ok=0,bad=0;for(const f of Array.from(fileList||[])){
 let m=f.name.toLowerCase().match(/^([a-zv]+[1-5])(?:[_-][^.]*)?\.(mp3|m4a|ogg|oga|wav|flac)$/);
 if(!m){bad++;continue}
 try{await storeRecording(m[1],f);ok++}catch(e){bad++}
 }alert('Импортировано записей: '+ok+'. Пропущено: '+bad+'. Название файла должно начинаться с пиньиня и номера тона, например qing1.mp3.');}

function stats(){ $('#stats').innerHTML=`<div class="stat"><strong>${learned()} / 214</strong><span>Начаты ключи</span></div><div class="stat"><strong>${known()} / 214</strong><span>Знаю ключей</span></div><div class="stat"><strong>${DB.families.filter((_,i)=>stat('f'+i)===2).length} / 30</strong><span>Знаю семейств</span></div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===state.tab));stats();if(state.tab==='radicals')renderRadicals();if(state.tab==='families')renderFamilies();if(state.tab==='study')renderStudy();if(state.tab==='quiz')renderQuiz();if(state.tab==='writing')renderWriting();if(state.tab==='progress')renderProgress()}
function renderRadicals(){let a=DB.radicals.filter(r=>(state.group==='all'||r.group==state.group)&&(state.status==='all'||(state.status==='new'?stat('r'+r.id)===0:state.status==='learning'?stat('r'+r.id)===1:stat('r'+r.id)===2))&&`${r.id} ${r.hanzi} ${r.display} ${r.meaning} ${r.pinyin||''}`.toLowerCase().includes(state.search.toLowerCase()));$('#app').innerHTML=`<div class="panel"><h2>Словарь ключей</h2>${styleControl()}<div class="notice">Группа 1: учи написание и значение. Группа 2: добавляй произношение распространённых самостоятельных иероглифов. Группа 3: изучай вместе с фонетическими примерами. Некоторые ключи могут выполнять несколько функций.</div><div class="filters"><input id="search" placeholder="Поиск: знак, значение или номер" value="${escapeHtml(state.search)}"><select id="group"><option value="all">Все группы</option>${[1,2,3].map(i=>`<option value="${i}" ${state.group==i?'selected':''}>${G[i]}</option>`).join('')}</select><select id="status"><option value="all">Любой прогресс</option><option value="new" ${state.status==='new'?'selected':''}>Не изучено</option><option value="learning" ${state.status==='learning'?'selected':''}>Повторить</option><option value="known" ${state.status==='known'?'selected':''}>Знаю</option></select></div><p class="muted">Найдено: ${a.length}</p><div class="grid">${a.map(r=>`<button class="tile" data-id="${r.id}"><span class="muted">№ ${r.id} ${stat('r'+r.id)===2?'✓':stat('r'+r.id)===1?'◉':''}</span><span class="char">${r.display}</span>${r.group===2&&r.pinyin?`<span class="muted" style="font-weight:700">${r.pinyin}</span>`:''}<small>${escapeHtml(r.meaning)}</small></button>`).join('')}</div></div>`;$('#search').oninput=e=>{let v=e.target.value;state.search=v;const pos=e.target.selectionStart;renderRadicals();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#group').onchange=e=>{state.group=e.target.value;renderRadicals()};$('#status').onchange=e=>{state.status=e.target.value;renderRadicals()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openRadical(+b.dataset.id));initStyleControl()}
function openRadical(id){const r=DB.radicals[id-1];$('#app').innerHTML=`<div class="panel study"><button class="btn alt" id="back">← К списку</button><div class="muted" style="margin-top:15px">Ключ Канси № ${id}</div><div class="herochar">${r.display}</div>${r.group===2&&r.pinyin?`<h2 style="color:#294976">${r.pinyin}</h2>`:''}<div class="flex" style="justify-content:center"><button class="btn alt" id="writeThis">✍ Написание и порядок черт</button></div>${r.hanzi!==r.display?`<p class="muted">Традиционная форма: <b>${r.hanzi}</b></p>`:''}<h2>${escapeHtml(r.meaning)}</h2><p><span class="pill group${r.group}">${G[r.group]}</span></p><p class="hint">${r.group===1?'Отдельное чтение пока можно не запоминать.':r.group===2?'Самостоятельное произношение учи по мере встречи с этим иероглифом.':'Попробуй найти похожие по звучанию иероглифы в разделе «Фонетики».'}</p><div class="flex" style="justify-content:center"><button class="btn alt" id="speak">▶ Слог</button>${r.group===2?`<button class="btn alt" id="speakChar">▶ Знак</button>`:""}<button class="btn alt" id="repeat">◉ Повторить</button><button class="btn good" id="know">✓ Знаю</button></div><p class="hint" data-audio-status="${r.display}"></p><p class="hint">Используются записи носителя языка (путунхуа) из открытого набора audio-cmn. Для прослушивания требуется интернет. У редких ключей и неоднозначных чтений звук может отсутствовать.</p></div>`;$('#back').onclick=renderRadicals;$('#writeThis').onclick=()=>goWrite(r.display);$('#speak').onclick=()=>speak(r.display);if($('#speakChar'))$('#speakChar').onclick=()=>speak(r.display,'character');$('#repeat').onclick=()=>setstat('r'+id,1);$('#know').onclick=()=>setstat('r'+id,2)}
function renderFamilies(){let a=DB.families.map((f,i)=>({...f,id:i})).filter(f=>state.famTier==='all'||f.tier==state.famTier);$('#app').innerHTML=`<div class="panel"><h2>30 фонетических семейств</h2>${styleControl()}<p class="hint">Фонетик подсказывает примерное звучание, но не всегда тон или начальный согласный. Сравни два варианта: «Слог» (Chen Wang) и «Знак» (Yue Tan). Отдельные записи есть не для всех знаков. Кнопки ♥ сохраняют лучший по твоему мнению вариант; кнопки ⚑ отмечают плохую запись. Для обеих кнопок нужен интернет; не каждый знак входит в аудиобиблиотеку.</p><div class="filters"><select id="tier"><option value="all">Все 30 семейств</option><option value="1" ${state.famTier==='1'?'selected':''}>Основные — 15</option><option value="2" ${state.famTier==='2'?'selected':''}>Дополнительные — 15</option></select></div><div class="familygrid">${a.map(f=>`<article class="family"><div class="flex space"><h3><span class="char">${f.root}</span><span>${f.pinyin}<br><small class="muted">${f.meaning}</small></span></h3><div class="flex"><button class="btn alt" data-speak="${f.root}" data-variant="syllable">▶ Слог</button><button class="btn alt" data-speak="${f.root}" data-variant="character" ${MISSING_CHARACTER_RECORDINGS.has(f.root)?'title="Отдельного файла нет: воспроизводится слог"':''}>${MISSING_CHARACTER_RECORDINGS.has(f.root)?'▶ Слог вместо знака':f.root==='申'?'▶ Слог (Commons)':'▶ Знак'}</button></div></div><p class="muted" style="margin:9px 0 3px">${f.tier===1?'Основное':'Дополнительное'} семейство</p>${f.examples.map(e=>`<button class="example" data-speak="${e.hanzi}" data-variant="character"><b>${e.hanzi} ${e.pinyin}</b><small>${e.meaning}</small></button>`).join('')}<div class="flex">${COMMONS_AUDIO[f.root]&&COMMONS_AUDIO[f.root].kind==='syllable'?`<button class="btn alt" data-speak="${f.root}" data-variant="commons">▶ Доп. голос</button>`:''}</div><div class="flex">${ALTERNATIVE_HSK_VOICE[f.root]?`<button class="btn alt" data-speak="${f.root}" data-variant="alternate">▶ Ещё голос</button>`:""}</div><p class="hint" data-audio-status="${f.root}">${MISSING_CHARACTER_RECORDINGS.has(f.root)?'Нет отдельной записи знака; воспроизводится слог.':f.root==='申'?'В Commons добавлен звук shēn (другой знак с тем же чтением).':COMMONS_AUDIO[f.root]?'Есть дополнительный голос слога из Wikimedia Commons.':''}</p><div class="flex" style="margin-top:12px"><button class="btn ${audioPreferences[f.root]==='syllable'?'good':'alt'}" data-audio-preference="${f.root}" data-pref-variant="syllable" aria-pressed="${audioPreferences[f.root]==='syllable'}">♥ Лучше слог</button><button class="btn ${audioPreferences[f.root]==='character'?'good':'alt'}" data-audio-preference="${f.root}" data-pref-variant="character" aria-pressed="${audioPreferences[f.root]==='character'}" ${MISSING_CHARACTER_RECORDINGS.has(f.root)?'disabled':''}>♥ Лучше знак</button></div><div class="flex" style="margin-top:12px"><button class="btn alt" data-report="${f.root}" data-report-variant="syllable">⚑ Слог</button><button class="btn alt" data-report="${f.root}" data-report-variant="character">⚑ Знак</button></div><p class="hint" data-report-status="${f.root}"></p><div style="margin-top:12px"><button class="btn alt" data-write="${f.root}">✍ Прописи</button> <button class="btn ${stat('f'+f.id)===2?'good':'alt'}" data-family="${f.id}">${stat('f'+f.id)===2?'✓ Семейство изучено':'Отметить как изученное'}</button></div></article>`).join('')}</div></div>`;initStyleControl();$('#tier').onchange=e=>{state.famTier=e.target.value;renderFamilies()};document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak,b.dataset.variant||'syllable'));document.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>reportAudio(b.dataset.report,b.dataset.reportVariant));document.querySelectorAll('[data-audio-preference]').forEach(b=>b.onclick=()=>choosePreferredAudio(b.dataset.audioPreference,b.dataset.prefVariant));document.querySelectorAll('[data-write]').forEach(b=>b.onclick=()=>goWrite(b.dataset.write));initStyleControl();document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>setstat('f'+b.dataset.family,stat('f'+b.dataset.family)===2?0:2))}
function studyPool(){if(state.studySet==='families')return DB.families.map((f,i)=>({key:'f'+i,char:f.root,back:`${f.pinyin} — ${f.meaning}`,extra:f.examples.map(e=>`${e.hanzi} ${e.pinyin}`).join(' · ')}));return DB.radicals.filter(r=>state.studySet==='all'||(state.studySet==='review'?stat('r'+r.id)!==2:r.group==state.studySet)).map(r=>({key:'r'+r.id,char:r.display,back:r.meaning+(r.group===2&&r.pinyin?' · '+r.pinyin:''),extra:`№ ${r.id} · ${G[r.group]}`}))}
function renderStudy(){let pool=studyPool();if(state.current>=pool.length)state.current=0;let x=pool[state.current];$('#app').innerHTML=`<div class="panel study"><h2>Карточки для запоминания</h2>${styleControl()}<div class="filters"><select id="studyset"><option value="all">Все 214 ключей</option><option value="review">Только новые и на повторение</option><option value="1">Группа 1</option><option value="2">Группа 2</option><option value="3">Группа 3</option><option value="families">30 фонетических семейств</option></select></div>${x?`<div class="muted">Карточка ${state.current+1} из ${pool.length}</div><div class="herochar">${x.char}</div>${state.revealed?`<h2>${x.back}</h2><p class="hint">${x.extra}</p>`:`<p class="hint">Вспомни значение и, если нужно, чтение</p>`}<div class="flex" style="justify-content:center"><button class="btn alt" id="sound">▶</button><button class="btn alt" id="writeCard">✍ Написать</button><button class="btn" id="flip">${state.revealed?'Скрыть':'Показать ответ'}</button></div>${state.revealed?`<div class="flex" style="justify-content:center;margin:15px 0"><button class="btn bad" id="again">Повторить</button><button class="btn good" id="yes">Знаю</button></div>`:''}<div class="flex" style="justify-content:center;margin:16px 0"><button class="btn alt" id="prev">← Назад</button><button class="btn alt" id="next">Дальше →</button></div>`:`<div class="empty">Все карточки выбранного набора уже изучены.</div>`}</div>`;initStyleControl();$('#studyset').value=state.studySet;$('#studyset').onchange=e=>{state.studySet=e.target.value;state.current=0;state.revealed=false;renderStudy()};if(!x)return;initStyleControl();$('#writeCard').onclick=()=>goWrite(x.char);$('#sound').onclick=()=>speak(x.char);$('#flip').onclick=()=>{state.revealed=!state.revealed;renderStudy()};$('#prev').onclick=()=>{state.current=(state.current+pool.length-1)%pool.length;state.revealed=false;renderStudy()};$('#next').onclick=()=>advance();if(state.revealed){$('#again').onclick=()=>{progress[x.key]=1;save();advance()};$('#yes').onclick=()=>{progress[x.key]=2;save();advance()}}}
function advance(){state.current++;state.revealed=false;render()}
function nextQuestion(){let pool=DB.radicals;let target=pool[Math.floor(Math.random()*pool.length)],opts=[target];let options=pool.filter(r=>r.id!==target.id&&r.meaning!==target.meaning);while(opts.length<4){let pick=options.splice(Math.floor(Math.random()*options.length),1)[0];if(pick&&!opts.some(o=>o.meaning===pick.meaning))opts.push(pick)}opts.sort(()=>Math.random()-.5);state.quiz={target,options:opts,answer:null};renderQuiz()}
function renderQuiz(){if(!state.quiz){nextQuestion();return}let q=state.quiz;$('#app').innerHTML=`<div class="panel study"><h2>Проверка значения ключей</h2><p class="muted">Верно: ${state.quizWins} из ${state.quizCount}</p><div class="herochar">${q.target.display}</div><p class="hint">Какое значение у этого ключа?</p><div class="quiz-options">${q.options.map(o=>`<button data-opt="${o.id}" class="${q.answer===null?'':o.id===q.target.id?'correct':o.id===q.answer?'wrong':''}" ${q.answer!==null?'disabled':''}>${escapeHtml(o.meaning)}</button>`).join('')}</div>${q.answer!==null?`<p style="font-weight:700">${q.answer===q.target.id?'Правильно!':'Ответ: '+q.target.meaning}</p><button class="btn" id="newq">Следующий вопрос →</button>`:''}</div>`;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(q.answer!==null)return;q.answer=+b.dataset.opt;state.quizCount++;if(q.answer===q.target.id){state.quizWins++;progress['r'+q.target.id]=2}else progress['r'+q.target.id]=1;save();renderQuiz()});if(q.answer!==null)$('#newq').onclick=nextQuestion}
function renderProgress(){$('#app').innerHTML=`<div class="panel"><h2>Твой прогресс</h2><p class="hint">Прописи завершены: <b>${Object.keys(writeProgress).length}</b> знаков · удачные попытки (0–1 ошибка): <b>${Object.values(writeProgress).filter(v=>v.best<=1).length}</b>. Результаты сохраняются отдельно от карточек и не стираются при переключении версии.</p><p class="hint">Состояния карточек сохраняются локально на этом устройстве. «Знаю» — самооценка; для долговременного запоминания возвращайся к карточкам повторно.</p><p>Знаю: <b>${known()}</b> ключей. На повторении: <b>${DB.radicals.filter(r=>stat('r'+r.id)===1).length}</b>.</p><div class="flex"><button class="btn" id="export">Скачать прогресс JSON</button><label class="btn alt">Импортировать JSON<input type="file" id="import" accept=".json,application/json" style="display:none"></label><button class="btn bad" id="reset">Сбросить прогресс</button></div><p class="hint">Экспорт пригодится при переносе на другой телефон или при очистке браузера.</p><hr><h3>Аудиозаписи носителей языка</h3><p class="hint">Онлайн-озвучивание носителем языка подключено (audio-cmn, Chen Wang, CC BY-SA). При наличии интернета нажимай ▶ на карточках. Браузерный синтез отключён. При необходимости можно импортировать MP3/OGG/M4A/FLAC/WAV записи с именами по пиньиню и тону: qing1.mp3, ma3.ogg, fang2.mp3. Можно выбрать сразу много файлов. Они сохраняются в IndexedDB этого браузера, однако текущий режим воспроизводит онлайн-записи; импортированные файлы пока не выбираются автоматически. В разделе «Фонетики» добавлены две независимые записи для сравнения: слог Chen Wang и иероглиф Yue Tan (если он есть в HSK-библиотеке). Обе записи CC BY-SA. Короткие исходные записи автоматически не удлиняются: для изучения тонов выбирай звучащую полностью запись. Это не тренажёр тоновых изменений в связной речи.</p><hr><h3>Замечания по произношению</h3><p class="hint">Нажми ⚑ рядом с фонетиком, если выбранная запись обрывается или плохо слышна. Замечания сохраняются локально, их можно выгрузить одним файлом и прислать для исправления.</p><p>Отмечено записей: <b>${Object.keys(audioReports).length}</b></p><div class="flex"><button class="btn alt" id="exportaudio">Скачать список проблем</button><button class="btn alt" id="clearaudio">Очистить список</button></div><hr><label class="btn alt">Загрузить аудиофайлы<input type="file" id="importaudio" accept="audio/*,.mp3,.ogg,.oga,.m4a,.wav,.flac" multiple style="display:none"></label><p class="hint">Внимание: импортируйте только записи, для которых есть право на использование; пиньинь в названии должен точно соответствовать звуку. Некоторые иероглифы многозначны и имеют несколько чтений.</p></div>`;$('#importaudio').onchange=async e=>{await addAudioFiles(e.target.files);e.target.value=''};$('#exportaudio').onclick=downloadAudioReports;$('#clearaudio').onclick=()=>{if(confirm('Очистить замечания по аудио?')){audioReports={};localStorage.removeItem(REPORT_KEY);renderProgress()}};$('#export').onclick=()=>{const b=new Blob([JSON.stringify({version:2,progress,writeProgress},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hanzi-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.progress||typeof d.progress!=='object')throw Error('Не найден прогресс');progress=d.progress;save();if(d.writeProgress&&typeof d.writeProgress==='object'){writeProgress=d.writeProgress;saveWriteProgress()}render()}catch(e){alert('Не удалось загрузить: '+e.message)}};$('#reset').onclick=()=>{if(confirm('Удалить все отметки изучения?')){progress={};save();render()}}}

// Written with Hanzi Writer, using its authentic per-stroke SVG geometry and stroke medians.
// No made-up grading: unavailable character data disables the handwriting quiz.
const WRITE_KEY='hanzi_radicals_writing_v1';
let writeProgress={};try{writeProgress=JSON.parse(localStorage.getItem(WRITE_KEY))||{}}catch(e){}
let writer=null,writeData=null,writingSession=0,writingMistakes=0,writingDone=false;
function saveWriteProgress(){try{localStorage.setItem(WRITE_KEY,JSON.stringify(writeProgress))}catch(e){}}
function goWrite(ch){state.writeChar=ch;state.writeMode='demo';state.writeLevel=1;state.writeIndex=0;state.tab='writing';render()}
function writingMessage(s){const el=$('#writingStatus');if(el)el.textContent=s}
function safeChar(s){return [...String(s||'').trim()].length===1?s:'儿'}
function writingOpts(size){return {width:size,height:size,padding:17,showCharacter:state.writeMode==='demo',showOutline:state.writeMode!=='practice'||state.writeLevel<3,strokeColor:state.writeMode==='practice'?'#24945a':'#292520',outlineColor:'#d9d0c2',drawingColor:state.writeMode==='practice'?'#d67734':'#255d63',highlightColor:'#d67734',strokeAnimationSpeed:1.2,acceptBackwardsStrokes:false,leniency:state.writeLevel===1?1.35:state.writeLevel===2?1.0:.85,onLoadCharDataError:()=>writingMessage('Для этого знака пока нет доступных проверенных данных о чертах. Попробуй другой знак или проверь интернет.')};}
function renderWriting(){
 const ch=safeChar(state.writeChar);state.writeChar=ch;
 const radical=DB.radicals.find(r=>r.display===ch||r.hanzi===ch);
 const family=DB.families.find(f=>f.root===ch);
 const name=radical?radical.meaning:family?family.meaning:'Изучение написания';
 const p=writeProgress[ch];
 $('#app').innerHTML=`<div class="panel study" style="max-width:650px"><h2>✍ Каллиграфия и прописи</h2>${styleControl()}
 <div class="filters"><select id="writeSelect" aria-label="Выбрать графему">${DB.radicals.map(r=>`<option value="${escapeHtml(r.display)}" ${r.display===ch?'selected':''}>№${r.id} · ${escapeHtml(r.display)} — ${escapeHtml(r.meaning)}</option>`).join('')}</select><select id="writeFamily" aria-label="Выбрать фонетик"><option value="">30 фонетиков</option>${DB.families.map(f=>`<option value="${f.root}" ${f.root===ch?'selected':''}>${f.root} · ${f.pinyin}</option>`).join('')}</select></div>
 <div class="writer-side"><span class="brushchar" style="font-size:42px">${escapeHtml(ch)}</span><div style="text-align:left"><b>${escapeHtml(name)}</b><div class="writermeta">${p?'Лучшая попытка: '+p.best+' ошибок · выполнено '+p.count+' раз':'Пока нет завершённых прописей'}</div></div></div>
 <div class="levels"><button id="demoTab" class="level ${state.writeMode==='demo'?'on':''}">▶ Порядок черт</button><button id="practiceTab" class="level ${state.writeMode==='practice'?'on':''}">✍ Тренировка</button><button id="modeReset" class="level">↻ Повторить</button></div>
 ${state.writeMode==='practice'?`<div class="levels"><button data-level="1" class="level ${state.writeLevel===1?'on':''}">1 · Обвести</button><button data-level="2" class="level ${state.writeLevel===2?'on':''}">2 · Подсказка</button><button data-level="3" class="level ${state.writeLevel===3?'on':''}">3 · По памяти</button></div>`:''}
 <div class="writerbox"><div id="writingCanvas"></div></div><div id="writingStatus" class="writerstatus" role="status">Загружаю проверенные контуры черт…</div>
 <div id="writingActions" class="writer-actions"></div><p class="hint" style="font-size:12px">Для анимации и проверки нужна загрузка данных Hanzi Writer из интернета. Алгоритм оценивает движения, порядок, направление и расположение черт, но не художественное качество каллиграфии. Доступность данных зависит от знака.</p></div>`;
 initStyleControl();$('#writeSelect').onchange=e=>goWrite(e.target.value);$('#writeFamily').onchange=e=>{if(e.target.value)goWrite(e.target.value)};
 $('#demoTab').onclick=()=>{state.writeMode='demo';renderWriting()};$('#practiceTab').onclick=()=>{state.writeMode='practice';renderWriting()};$('#modeReset').onclick=()=>renderWriting();
 document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{state.writeLevel=+b.dataset.level;renderWriting()});
 initializeWriter(ch);
}
async function initializeWriter(ch){
 const token=++writingSession;writer=null;writeData=null;writingMistakes=0;writingDone=false;
 const actions=$('#writingActions');if(actions)actions.innerHTML='';
 try{
  // Allow the deferred library time to load while preserving a visible error for offline usage.
  for(let i=0;i<28&&!window.HanziWriter;i++)await new Promise(r=>setTimeout(r,150));
  if(!window.HanziWriter)throw Error('Не удалось загрузить библиотеку написания. Проверь подключение к интернету.');
  const data=await HanziWriter.loadCharacterData(ch);
  if(token!==writingSession||state.tab!=='writing')return;
  if(!data||!Array.isArray(data.strokes)||!data.strokes.length)throw Error('Данные о чертах отсутствуют.');
  writeData=data;
  const box=$('#writingCanvas');if(!box)return;
  const size=Math.min(340,Math.floor(box.getBoundingClientRect().width)||300);
  const opts=writingOpts(size);
  writer=HanziWriter.create(box,ch,{...opts,charDataLoader:(char,onLoad)=>onLoad(data)});
  if(state.writeMode==='demo')showStrokeOrder();else startWritingQuiz();
 }catch(err){if(token!==writingSession)return;writingMessage(err.message||'Не удалось загрузить данные для этого знака.');}
}
function showStrokeOrder(){if(!writer||!writeData)return;
 const count=writeData.strokes.length;
 const action=$('#writingActions');
 action.innerHTML='<button class="btn alt" id="strokePrev">← Черта</button><button class="btn alt" id="strokeNext">Черта →</button><button class="btn" id="strokeAll">▶ Все черты</button><button class="btn alt" id="strokeRestart">↻ Сначала</button>';
 const explain=()=>writingMessage(`Всего черт: ${count}. ${state.writeIndex+1}-я черта из ${count}. Нажми «Все черты» или пролистывай по одной.`);
 explain();
 $('#strokePrev').onclick=()=>{state.writeIndex=(state.writeIndex-1+count)%count;writer.highlightStroke(state.writeIndex);explain()};
 $('#strokeNext').onclick=()=>{state.writeIndex=(state.writeIndex+1)%count;writer.animateStroke(state.writeIndex);explain()};
 $('#strokeAll').onclick=()=>{writer.animateCharacter();writingMessage(`Анимация всех ${count} черт по порядку.`)};
 $('#strokeRestart').onclick=()=>{state.writeIndex=0;writer.animateCharacter();writingMessage('Анимация запущена заново.')};
}
function startWritingQuiz(){if(!writer||!writeData)return;
 const level=state.writeLevel;
 const actions=$('#writingActions');
 actions.innerHTML='<button class="btn alt" id="writeClear">↻ Очистить</button><button class="btn alt" id="writeHint">◉ Показать подсказку</button><button class="btn alt" id="writeOrder">▶ Порядок черт</button>';
 const message={1:'Обведи серые линии в правильном порядке. Пиши пальцем прямо по образцу.',2:'Пиши самостоятельно: видны только бледные контуры черт.',3:'Напиши знак по памяти, без контуров. Подсказку можно открыть отдельно.'};
 writingMessage(message[level]);
 // Level 1: thick grey outline; level 2: faint outline; level 3: blank grid.
 if(level===3)writer.hideOutline({duration:0});else writer.showOutline({duration:0});
 writer.hideCharacter({duration:0});
 writer.quiz({leniency:level===1?1.4:level===2?1.05:.85,showHintAfterMisses:level===1?2:3,acceptBackwardsStrokes:false,highlightOnComplete:false,
 onMistake:data=>{writingMistakes=data.totalMistakes;writingMessage(`🟠 Черта ${data.strokeNum+1}: попробуй ещё раз. Ошибок: ${writingMistakes}. Следи за началом, направлением и положением черты.`)},
 onCorrectStroke:data=>{writingMessage(`✅ Правильно! Черта ${data.strokeNum+1}. Осталось: ${data.strokesRemaining}. Ошибок: ${data.totalMistakes}.`)},
 onComplete:data=>{writingDone=true;writingMistakes=data.totalMistakes;const judgement=writingMistakes===0?'Правильно':writingMistakes<=2?'Почти правильно':'Надо повторить';
 const ch=state.writeChar,old=writeProgress[ch]||{count:0,best:999};writeProgress[ch]={count:old.count+1,best:Math.min(old.best,writingMistakes),last:writingMistakes,level,updated:new Date().toISOString()};saveWriteProgress();writingMessage(`✓ ${judgement}! ${writeData.strokes.length} черт, ошибок: ${writingMistakes}. Результат сохранён. Нажми «Очистить» для новой попытки.`)}
 });
 $('#writeClear').onclick=()=>renderWriting();
 $('#writeHint').onclick=()=>{writer.showOutline({duration:0});writingMessage('Контуры открыты. После подсказки продолжай писать; результат этой попытки учитывает помощь.')};
 $('#writeOrder').onclick=()=>{state.writeMode='demo';renderWriting()};
}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()});render();</script></body></html>
