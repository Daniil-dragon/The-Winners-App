async function initializeWriter(ch){

 try{

  for(let i=0;i<28&&!window.HanziWriter;i++)await new Promise(r=>setTimeout(r,150));
  if(!window.HanziWriter)throw Error('Не удалось загрузить библиотеку написания. Проверь подключение к интернету.');
  const data=await HanziWriter.loadCharacterData(ch);
  if(token!==writingSession||state.tab!=='writing')return;

  writeData=data;

}
let strokePlayerRun=0,strokePlayerPlaying=false,strokePlayerNext=0,strokePlayerStopped=false;
function stopStrokePlayer(){
 strokePlayerRun++;strokePlayerPlaying=false;
 if(writer&&typeof writer.cancelAnimation==='function')writer.cancelAnimation();
}
function showStrokeOrder(){

 actions.innerHTML='<div class="flex" style="justify-content:center;align-items:center;gap:8px"><button class="btn alt" id="strokePrev">← Предыдущая</button><span id="strokePosition" class="muted" aria-live="polite"></span><button class="btn alt" id="strokeNext">Следующая →</button></div><div class="flex" style="justify-content:center;margin-top:10px"><button class="btn" id="strokePlay">▶ Смотреть все черты</button></div>';

 };
 const describe=()=>writingMessage('Показано черт: '+strokePlayerNext+' из '+count+'. «Предыдущая» — шаг назад, «Следующая» — шаг вперёд.');
 const reset=async target=>{
  const run=++strokePlayerRun;
  strokePlayerPlaying=false;strokePlayerStopped=true;

 async function playSequence(){
  if(strokePlayerPlaying){stopStrokePlayer();strokePlayerStopped=true;update();return}
  if(strokePlayerNext>=count){await reset(0);strokePlayerStopped=false}
  const run=++strokePlayerRun;
  strokePlayerPlaying=true;update();
  if(strokePlayerNext===0)await writer.hideCharacter({duration:0});
  for(let k=strokePlayerNext;k<count;k++){
   if(run!==strokePlayerRun)break;
   writingMessage('Выполняется черта '+(k+1)+' из '+count+'. Нажми «Остановить», чтобы рассмотреть написание.');
   await writer.animateStroke(k);
   if(run!==strokePlayerRun)break;
   strokePlayerNext=k+1;update();
  }
  if(run!==strokePlayerRun)return;
  strokePlayerPlaying=false;strokePlayerStopped=strokePlayerNext<count;update();
  if(strokePlayerNext>=count)writingMessage('Все '+count+' '+strokeWord(count)+' показаны. Можно повторить просмотр или вернуться к нужной черте.');

 play.onclick=()=>{playSequence().catch(e=>writingMessage('Не удалось показать черты: '+e.message))};

}

 const message={1:'Обведи серые линии в правильном порядке. Пиши пальцем прямо по образцу.',2:'Пиши по точкам начала черт, без готовых контуров.',3:'Напиши знак по памяти, без контуров. Подсказку можно открыть отдельно.'};

 onCorrectStroke:data=>{writingNextStroke=data.strokeNum+1;writingMessage(`✅ Правильно! Черта ${data.strokeNum+1}. Осталось: ${data.strokesRemaining}. Ошибок: ${data.totalMistakes}.`)},
 onComplete:data=>{writingDone=true;writingMistakes=data.totalMistakes;writingNextStroke=writeData.strokes.length;const k=$('#writingKnow');if(k)k.style.display='inline-flex';const judgement=writingMistakes===0?'Правильно':writingMistakes<=2?'Почти правильно':'Надо повторить';
 const ch=state.writeChar,old=writeProgress[ch]||{count:0,best:999};writeProgress[ch]={count:old.count+1,best:Math.min(old.best,writingMistakes),last:writingMistakes,level,hints:writingHelpUsed,updated:new Date().toISOString()};saveWriteProgress();writingMessage(`✓ ${judgement}! ${writeData.strokes.length} ${strokeWord(writeData.strokes.length)}, ошибок: ${writingMistakes}. Результат сохранён. Нажми «Очистить» для новой попытки.`)}

}
