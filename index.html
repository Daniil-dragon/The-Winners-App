let progress={};try{progress=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){};const state={tab:'radicals',search:'',group:'all',status:'all',famTier:'all',current:0,studySet:'all',revealed:false,quiz:null,quizCount:0,quizWins:0};
const $=s=>document.querySelector(s);const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){alert('Браузер не разрешил сохранение. Для надёжного прогресса открой приложение по HTTPS.')}}function stat(id){return progress[id]||0}function setstat(id,n){progress[id]=n;save();render()}function known(){return DB.radicals.filter(x=>stat('r'+x.id)===2).length}function learned(){return DB.radicals.filter(x=>stat('r'+x.id)>0).length}
// Audio 0.2: recordings only; never silently substitute TTS for a different reading.
const AUDIO_COMMONS={'五|wǔ':'https://commons.wikimedia.org/wiki/Special:Redirect/file/Zh-wǔ.ogg'};
let currentRecording=null;
const readIndex=new Map();
for(const f of DB.families){readIndex.set(f.root,f.pinyin);for(const e of f.examples)readIndex.set(e.hanzi,e.pinyin)}
function toneFile(p){
 const m={'ā':['a',1],'á':['a',2],'ǎ':['a',3],'à':['a',4],'ē':['e',1],'é':['e',2],'ě':['e',3],'è':['e',4],
 'ī':['i',1],'í':['i',2],'ǐ':['i',3],'ì':['i',4],'ō':['o',1],'ó':['o',2],'ǒ':['o',3],'ò':['o',4],
 'ū':['u',1],'ú':['u',2],'ǔ':['u',3],'ù':['u',4],'ǖ':['v',1],'ǘ':['v',2],'ǚ':['v',3],'ǜ':['v',4]};
 let syllables=p.normalize('NFC').toLowerCase().trim().split(/\s+/);if(syllables.length!==1||p.includes('/'))return null;
 let tone=5,base='';for(const c of syllables[0]){if(m[c]){base+=m[c][0];tone=m[c][1]}else base+=c==='ü'?'v':c}
 return /^[a-zv]+$/.test(base)?base+tone:null;
}
function getReading(x){return readIndex.get(x)||(x==='五'?'wǔ':null)}
function audioDB(){return new Promise((res,rej)=>{let r=indexedDB.open('hanzi_radicals_audio_v1',1);r.onupgradeneeded=()=>r.result.createObjectStore('files');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function storeRecording(name,blob){let db=await audioDB();return new Promise((res,rej)=>{let tx=db.transaction('files','readwrite');tx.objectStore('files').put(blob,name);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>{db.close();rej(tx.error)}})}
async function loadRecording(name){let db=await audioDB();return new Promise((res,rej)=>{let tx=db.transaction('files','readonly'),q=tx.objectStore('files').get(name);q.onsuccess=()=>{db.close();res(q.result)};q.onerror=()=>{db.close();rej(q.error)}})}

const AUDIO_BASE='https://raw.githubusercontent.com/hugolpz/audio-cmn/master/64k/syllabs/cmn-';
const AUDIO_SOURCE='https://github.com/hugolpz/audio-cmn';
function remoteAudioUrl(key){return AUDIO_BASE+encodeURIComponent(key)+'.mp3'}
function stopAudio(){if(currentRecording){currentRecording.pause();currentRecording.onended=null;currentRecording=null}}
function playRecording(url,x,py,local=false){
 const a=new Audio(url);currentRecording=a;
 a.onended=()=>{if(local)URL.revokeObjectURL(url);if(currentRecording===a)currentRecording=null};
 a.onerror=()=>{if(local)URL.revokeObjectURL(url);if(currentRecording===a)currentRecording=null;alert('Запись «'+x+'» ('+py+') недоступна. Проверь интернет или загрузи свой аудиофайл во вкладке «Прогресс».')};
 a.play().catch(e=>{if(local)URL.revokeObjectURL(url);if(currentRecording===a)currentRecording=null;alert('Не удалось воспроизвести звук: '+e.message)});
}
function speak(x){
 stopAudio();
 const py=getReading(x);
 if(!py){alert('Для «'+x+'» пока не задано однозначное чтение. Неверный тон воспроизводить не будем.');return}
 const key=toneFile(py);
 if(!key){alert('У «'+x+'» несколько чтений ('+py+'). Нужно выбрать конкретное чтение.');return}
 if(key.endsWith('5')){alert('Для нейтрального тона «'+x+'» ('+py+') нет проверенной отдельной записи. Требуется специальная запись, а не подмена первым тоном.');return}
 // Start online playback synchronously from the user click: critical on iOS Safari.
 // Remote files are real human syllable recordings, not synthesized voices.
 playRecording(remoteAudioUrl(key),x,py);
}
async function addAudioFiles(fileList){let ok=0,bad=0;for(const f of Array.from(fileList||[])){
 let m=f.name.toLowerCase().match(/^([a-zv]+[1-5])(?:[_-][^.]*)?\.(mp3|m4a|ogg|oga|wav|flac)$/);
 if(!m){bad++;continue}
 try{await storeRecording(m[1],f);ok++}catch(e){bad++}
 }alert('Импортировано записей: '+ok+'. Пропущено: '+bad+'. Название файла должно начинаться с пиньиня и номера тона, например qing1.mp3.');}

function render(){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x.dataset.tab===state.tab));stats();if(state.tab==='radicals')renderRadicals();if(state.tab==='families')renderFamilies();if(state.tab==='study')renderStudy();if(state.tab==='quiz')renderQuiz();if(state.tab==='progress')renderProgress()}
function renderRadicals(){let a=DB.radicals.filter(r=>(state.group==='all'||r.group==state.group)&&(state.status==='all'||(state.status==='new'?stat('r'+r.id)===0:state.status==='learning'?stat('r'+r.id)===1:stat('r'+r.id)===2))&&`${r.id} ${r.hanzi} ${r.display} ${r.meaning}`.toLowerCase().includes(state.search.toLowerCase()));$('#app').innerHTML=`<div class="panel"><h2>Словарь ключей</h2><div class="notice">Группа 1: учи написание и значение. Группа 2: добавляй произношение распространённых самостоятельных иероглифов. Группа 3: изучай вместе с фонетическими примерами. Некоторые ключи могут выполнять несколько функций.</div><div class="filters"><input id="search" placeholder="Поиск: знак, значение или номер" value="${escapeHtml(state.search)}"><select id="group"><option value="all">Все группы</option>${[1,2,3].map(i=>`<option value="${i}" ${state.group==i?'selected':''}>${G[i]}</option>`).join('')}</select><select id="status"><option value="all">Любой прогресс</option><option value="new" ${state.status==='new'?'selected':''}>Не изучено</option><option value="learning" ${state.status==='learning'?'selected':''}>Повторить</option><option value="known" ${state.status==='known'?'selected':''}>Знаю</option></select></div><p class="muted">Найдено: ${a.length}</p><div class="grid">${a.map(r=>`<button class="tile" data-id="${r.id}"><span class="muted">№ ${r.id} ${stat('r'+r.id)===2?'✓':stat('r'+r.id)===1?'◉':''}</span><span class="char">${r.display}</span><small>${escapeHtml(r.meaning)}</small></button>`).join('')}</div></div>`;$('#search').oninput=e=>{let v=e.target.value;state.search=v;const pos=e.target.selectionStart;renderRadicals();$('#search').focus();$('#search').setSelectionRange(pos,pos)};$('#group').onchange=e=>{state.group=e.target.value;renderRadicals()};$('#status').onchange=e=>{state.status=e.target.value;renderRadicals()};document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openRadical(+b.dataset.id))}
function openRadical(id){const r=DB.radicals[id-1];$('#app').innerHTML=`<div class="panel study"><button class="btn alt" id="back">← К списку</button><div class="muted" style="margin-top:15px">Ключ Канси № ${id}</div><div class="herochar">${r.display}</div>${r.hanzi!==r.display?`<p class="muted">Традиционная форма: <b>${r.hanzi}</b></p>`:''}<h2>${escapeHtml(r.meaning)}</h2><p><span class="pill group${r.group}">${G[r.group]}</span></p><p class="hint">${r.group===1?'Отдельное чтение пока можно не запоминать.':r.group===2?'Самостоятельное произношение учи по мере встречи с этим иероглифом.':'Попробуй найти похожие по звучанию иероглифы в разделе «Фонетики».'}</p><div class="flex" style="justify-content:center"><button class="btn alt" id="speak">▶ Произнести знак</button><button class="btn alt" id="repeat">◉ Повторить</button><button class="btn good" id="know">✓ Знаю</button></div><p class="hint">Используются записи носителя языка (путунхуа) из открытого набора audio-cmn. Для прослушивания требуется интернет. У редких ключей и неоднозначных чтений звук может отсутствовать.</p></div>`;$('#back').onclick=renderRadicals;$('#speak').onclick=()=>speak(r.display);$('#repeat').onclick=()=>setstat('r'+id,1);$('#know').onclick=()=>setstat('r'+id,2)}
function renderFamilies(){let a=DB.families.map((f,i)=>({...f,id:i})).filter(f=>state.famTier==='all'||f.tier==state.famTier);$('#app').innerHTML=`<div class="panel"><h2>30 фонетических семейств</h2><p class="hint">Фонетик подсказывает примерное звучание, но не всегда тон или начальный согласный. Нажми ▶, чтобы услышать запись носителя языка. Требуется интернет. Некоторые чтения (особенно нейтральный тон) пока не озвучиваются.</p><div class="filters"><select id="tier"><option value="all">Все 30 семейств</option><option value="1" ${state.famTier==='1'?'selected':''}>Основные — 15</option><option value="2" ${state.famTier==='2'?'selected':''}>Дополнительные — 15</option></select></div><div class="familygrid">${a.map(f=>`<article class="family"><div class="flex space"><h3><span class="char">${f.root}</span><span>${f.pinyin}<br><small class="muted">${f.meaning}</small></span></h3><button class="btn alt" data-speak="${f.root}">▶</button></div><p class="muted" style="margin:9px 0 3px">${f.tier===1?'Основное':'Дополнительное'} семейство</p>${f.examples.map(e=>`<button class="example" data-speak="${e.hanzi}"><b>${e.hanzi} ${e.pinyin}</b><small>${e.meaning}</small></button>`).join('')}<div style="margin-top:12px"><button class="btn ${stat('f'+f.id)===2?'good':'alt'}" data-family="${f.id}">${stat('f'+f.id)===2?'✓ Семейство изучено':'Отметить как изученное'}</button></div></article>`).join('')}</div></div>`;$('#tier').onchange=e=>{state.famTier=e.target.value;renderFamilies()};document.querySelectorAll('[data-speak]').forEach(b=>b.onclick=()=>speak(b.dataset.speak));document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>setstat('f'+b.dataset.family,stat('f'+b.dataset.family)===2?0:2))}
function studyPool(){if(state.studySet==='families')return DB.families.map((f,i)=>({key:'f'+i,char:f.root,back:`${f.pinyin} — ${f.meaning}`,extra:f.examples.map(e=>`${e.hanzi} ${e.pinyin}`).join(' · ')}));return DB.radicals.filter(r=>state.studySet==='all'||(state.studySet==='review'?stat('r'+r.id)!==2:r.group==state.studySet)).map(r=>({key:'r'+r.id,char:r.display,back:r.meaning,extra:`№ ${r.id} · ${G[r.group]}`}))}
function renderStudy(){let pool=studyPool();if(state.current>=pool.length)state.current=0;let x=pool[state.current];$('#app').innerHTML=`<div class="panel study"><h2>Карточки для запоминания</h2><div class="filters"><select id="studyset"><option value="all">Все 214 ключей</option><option value="review">Только новые и на повторение</option><option value="1">Группа 1</option><option value="2">Группа 2</option><option value="3">Группа 3</option><option value="families">30 фонетических семейств</option></select></div>${x?`<div class="muted">Карточка ${state.current+1} из ${pool.length}</div><div class="herochar">${x.char}</div>${state.revealed?`<h2>${x.back}</h2><p class="hint">${x.extra}</p>`:`<p class="hint">Вспомни значение и, если нужно, чтение</p>`}<div class="flex" style="justify-content:center"><button class="btn alt" id="sound">▶</button><button class="btn" id="flip">${state.revealed?'Скрыть':'Показать ответ'}</button></div>${state.revealed?`<div class="flex" style="justify-content:center;margin:15px 0"><button class="btn bad" id="again">Повторить</button><button class="btn good" id="yes">Знаю</button></div>`:''}<div class="flex" style="justify-content:center;margin:16px 0"><button class="btn alt" id="prev">← Назад</button><button class="btn alt" id="next">Дальше →</button></div>`:`<div class="empty">Все карточки выбранного набора уже изучены.</div>`}</div>`;$('#studyset').value=state.studySet;$('#studyset').onchange=e=>{state.studySet=e.target.value;state.current=0;state.revealed=false;renderStudy()};if(!x)return;$('#sound').onclick=()=>speak(x.char);$('#flip').onclick=()=>{state.revealed=!state.revealed;renderStudy()};$('#prev').onclick=()=>{state.current=(state.current+pool.length-1)%pool.length;state.revealed=false;renderStudy()};$('#next').onclick=()=>advance();if(state.revealed){$('#again').onclick=()=>{progress[x.key]=1;save();advance()};$('#yes').onclick=()=>{progress[x.key]=2;save();advance()}}}
function advance(){state.current++;state.revealed=false;render()}
function nextQuestion(){let pool=DB.radicals;let target=pool[Math.floor(Math.random()*pool.length)],opts=[target];let options=pool.filter(r=>r.id!==target.id&&r.meaning!==target.meaning);while(opts.length<4){let pick=options.splice(Math.floor(Math.random()*options.length),1)[0];if(pick&&!opts.some(o=>o.meaning===pick.meaning))opts.push(pick)}opts.sort(()=>Math.random()-.5);state.quiz={target,options:opts,answer:null};renderQuiz()}
function renderQuiz(){if(!state.quiz){nextQuestion();return}let q=state.quiz;$('#app').innerHTML=`<div class="panel study"><h2>Проверка значения ключей</h2><p class="muted">Верно: ${state.quizWins} из ${state.quizCount}</p><div class="herochar">${q.target.display}</div><p class="hint">Какое значение у этого ключа?</p><div class="quiz-options">${q.options.map(o=>`<button data-opt="${o.id}" class="${q.answer===null?'':o.id===q.target.id?'correct':o.id===q.answer?'wrong':''}" ${q.answer!==null?'disabled':''}>${escapeHtml(o.meaning)}</button>`).join('')}</div>${q.answer!==null?`<p style="font-weight:700">${q.answer===q.target.id?'Правильно!':'Ответ: '+q.target.meaning}</p><button class="btn" id="newq">Следующий вопрос →</button>`:''}</div>`;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>{if(q.answer!==null)return;q.answer=+b.dataset.opt;state.quizCount++;if(q.answer===q.target.id){state.quizWins++;progress['r'+q.target.id]=2}else progress['r'+q.target.id]=1;save();renderQuiz()});if(q.answer!==null)$('#newq').onclick=nextQuestion}
function renderProgress(){$('#app').innerHTML=`<div class="panel"><h2>Твой прогресс</h2><p class="hint">Состояния карточек сохраняются локально на этом устройстве. «Знаю» — самооценка; для долговременного запоминания возвращайся к карточкам повторно.</p><p>Знаю: <b>${known()}</b> ключей. На повторении: <b>${DB.radicals.filter(r=>stat('r'+r.id)===1).length}</b>.</p><div class="flex"><button class="btn" id="export">Скачать прогресс JSON</button><label class="btn alt">Импортировать JSON<input type="file" id="import" accept=".json,application/json" style="display:none"></label><button class="btn bad" id="reset">Сбросить прогресс</button></div><p class="hint">Экспорт пригодится при переносе на другой телефон или при очистке браузера.</p><hr><h3>Аудиозаписи носителей языка</h3><p class="hint">Онлайн-озвучивание носителем языка подключено (audio-cmn, Chen Wang, CC BY-SA). При наличии интернета нажимай ▶ на карточках. Браузерный синтез отключён. При необходимости можно импортировать MP3/OGG/M4A/FLAC/WAV записи с именами по пиньиню и тону: qing1.mp3, ma3.ogg, fang2.mp3. Можно выбрать сразу много файлов. Они сохраняются в IndexedDB этого браузера, однако текущий режим воспроизводит онлайн-записи; импортированные файлы пока не выбираются автоматически. Односложные записи произносятся с изолированным тоном; это не тренажёр тоновых изменений в связной речи.</p><label class="btn alt">Загрузить аудиофайлы<input type="file" id="importaudio" accept="audio/*,.mp3,.ogg,.oga,.m4a,.wav,.flac" multiple style="display:none"></label><p class="hint">Внимание: импортируйте только записи, для которых есть право на использование; пиньинь в названии должен точно соответствовать звуку. Некоторые иероглифы многозначны и имеют несколько чтений.</p></div>`;$('#importaudio').onchange=async e=>{await addAudioFiles(e.target.files);e.target.value=''};$('#export').onclick=()=>{const b=new Blob([JSON.stringify({version:1,progress},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hanzi-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('#import').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!d.progress||typeof d.progress!=='object')throw Error('Не найден прогресс');progress=d.progress;save();render()}catch(e){alert('Не удалось загрузить: '+e.message)}};$('#reset').onclick=()=>{if(confirm('Удалить все отметки изучения?')){progress={};save();render()}}}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;state.tab=b.dataset.tab;render()});render();</script></body></html>
